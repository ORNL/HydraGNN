[pytest]
norecursedirs =
    .*
    __pycache__
    build
    dist
    CVS
    _darcs
    {arch}
    *.egg
    venv
    dataset
    .venv
    .uv-cache
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
markers =
    gpu: tests that require GPU resources
    deepspeed: tests that require DeepSpeed functionality
    mpi: tests that require execution with multiple MPI ranks
    network: opt-in tests that contact external services
    fairchem: optional numerical comparisons against native FAIR-Chem
