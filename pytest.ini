[pytest]
norecursedirs = dataset .venv .uv-cache build dist
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
markers =
    gpu: tests that require GPU resources
    deepspeed: tests that require DeepSpeed functionality
    network: opt-in tests that contact external services
    fairchem: optional numerical comparisons against native FAIR-Chem
