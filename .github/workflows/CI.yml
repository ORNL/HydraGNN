name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron:  '0 3 * * 1'

jobs:
  build:
    name: ${{ matrix.suite }} (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - suite: serial
            python: "3.11"
          - suite: serial
            python: "3.12"
          - suite: serial
            python: "3.13"
          - suite: serial
            python: "3.14"
          - suite: mpi
            python: "3.11"
          - suite: mpi
            python: "3.12"
          - suite: mpi
            python: "3.13"
          - suite: mpi
            python: "3.14"

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Checkout GCNN
        uses: actions/checkout@v4
      - name: Install MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev
          sudo apt-get clean
      - name: Cache pip
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.cache/pip
          key: ${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel meson-python ninja cython
          python -m pip install numpy==2.4.6
          # Install the pinned CPU PyTorch first so fairchem-core (in [dev])
          # cannot pull a different torch build, and so PyG extensions can build.
          python -m pip install --upgrade -v torch==2.13.0 torchvision==0.28.0 \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          # pyg-lib is not published on PyPI. Build the 0.8.0 release from its
          # pinned commit so CI does not depend on the data.pyg.org wheel host.
          python -m pip install --no-build-isolation -v "pyg_lib @ git+https://github.com/pyg-team/pyg-lib.git@26a2d1a06a4714da9bb804c19049afb4796971d7"
          # Derive the find-links wheel URL from the torch actually installed above.
          TORCH_VERSION="$(python -c 'import torch; print(torch.__version__.split("+")[0])')"
          # lmdb's py3-none-any wheel compiles at import from paths that do not exist.
          python -m pip install --upgrade --no-build-isolation -v -e ".[torch,dev]" --no-binary lmdb --find-links "https://data.pyg.org/whl/torch-${TORCH_VERSION}+cpu.html"
          python -c "import lmdb.cpython"
          # [uma] needs build isolation for omegaconf's sdist-only antlr4 dependency.
          python -m pip install -v --upgrade -e ".[uma]"
          python -m pip install --upgrade --no-build-isolation -v -e ".[deepspeed]" || echo "DeepSpeed installation failed, continuing without it"
      - name: Show installed packages
        run: |
          echo "=== Installed package versions ==="
          pip list | grep -E "(fairchem|numpy|scipy|torch|scikit-learn|matplotlib|ase|tensorboard)"
      - name: Format black
        run: |
          black .
          git diff --exit-code
      - name: Run serial pytest
        if: matrix.suite == 'serial'
        run: |
          pip list
          # Run native parity once, serially, and fail if the frozen FAIR-Chem
          # reference is missing or resolves to an unexpected version.
          python -c "import importlib.metadata as m; assert m.version('fairchem-core') == '2.22.0'"
          python -m pytest -rfEP -W error -W ignore::DeprecationWarning -W ignore::UserWarning --tb=native -m fairchem tests/test_fairchem_native_parity.py tests/test_fairchem_ase_import.py
          # Check if DeepSpeed is available
          if python -c "import deepspeed" 2>/dev/null; then
            echo "DeepSpeed available - running serial tests"
            python -m pytest -rfEP -W error -W ignore::DeprecationWarning -W ignore::UserWarning --tb=native -m "not mpi and not fairchem" tests examples/opflearn/opflearn_pipeline/tests
          else
            echo "DeepSpeed not available - skipping GPU/DeepSpeed tests"
            python -m pytest -rfEP -W error -W ignore::DeprecationWarning -W ignore::UserWarning --tb=native -m "not mpi and not gpu and not deepspeed and not fairchem" tests examples/opflearn/opflearn_pipeline/tests
          fi
      - name: Run MPI pytest
        if: matrix.suite == 'mpi'
        run: |
          mpirun -n 2 --oversubscribe python -m pytest -rfEP -W error -W ignore::DeprecationWarning -W ignore::UserWarning --tb=native --with-mpi -m "mpi and not gpu and not deepspeed and not fairchem" tests
